<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}NexVita{% endblock %}</title>
  <meta name="description" content="{% block description %}NexVita – Smart AI Health Platform{% endblock %}" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />

  <!-- Core CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/auth.css') }}" />

  {% block page_css %}{% endblock %}

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="auth-body">

  <!-- Flash Messages -->
  <div class="flash-container" id="flashContainer" style="top: var(--sp-4);">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
      <div class="flash {{ category }}" role="alert">
        <svg class="flash__icon" data-lucide="{% if category == 'success' %}check-circle{% elif category == 'danger' or category == 'error' %}x-circle{% elif category == 'warning' %}alert-triangle{% else %}info{% endif %}"></svg>
        <div class="flash__body"><p class="flash__msg">{{ message }}</p></div>
        <button class="flash__close" onclick="this.closest('.flash').remove()">
          <svg data-lucide="x"></svg>
        </button>
      </div>
      {% endfor %}
    {% endwith %}
  </div>

  {% block content %}{% endblock %}

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block page_js %}{% endblock %}
  <script>
    lucide.createIcons();
    setTimeout(() => {
      document.querySelectorAll('.flash').forEach(f => {
        f.style.opacity = '0';
        setTimeout(() => f.remove(), 400);
      });
    }, 5000);
  </script>
</body>
</html>
