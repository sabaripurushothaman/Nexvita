{% extends "base.html" %}
{% block title %}Edit Record – NexVita{% endblock %}
{% block page_title %}Edit Health Record{% endblock %}

{% block content %}
<div style="max-width:600px;">
  <div class="card card-padded">
    <form method="POST" action="{{ url_for('health.edit_record', id=record.id) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}" />

      <div class="form-group" style="margin-bottom:var(--sp-4);">
        <label class="form-label">Record Type</label>
        <select name="record_type" class="form-control">
          <option value="vital" {% if record.record_type == 'vital' %}selected{% endif %}>Vital Signs</option>
          {% for rtype in HEALTH_RECORD_TYPES %}
          <option value="{{ rtype }}" {% if record.record_type == rtype %}selected{% endif %}>{{ rtype | capitalize }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-grid form-grid-2" style="margin-bottom:var(--sp-4);">
        <div class="form-group">
          <label class="form-label">Systolic BP (mmHg)</label>
          <input type="number" name="systolic_bp" class="form-control" value="{{ record.systolic_bp or '' }}" />
        </div>
        <div class="form-group">
          <label class="form-label">Diastolic BP (mmHg)</label>
          <input type="number" name="diastolic_bp" class="form-control" value="{{ record.diastolic_bp or '' }}" />
        </div>
      </div>

      <div class="form-grid form-grid-2" style="margin-bottom:var(--sp-4);">
        <div class="form-group">
          <label class="form-label">Heart Rate (bpm)</label>
          <input type="number" name="heart_rate" class="form-control" value="{{ record.heart_rate or '' }}" />
        </div>
        <div class="form-group">
          <label class="form-label">Blood Sugar (mg/dL)</label>
          <input type="number" name="glucose_level" class="form-control" step="0.1" value="{{ record.glucose_level or '' }}" />
        </div>
      </div>

      <div class="form-grid form-grid-2" style="margin-bottom:var(--sp-4);">
        <div class="form-group">
          <label class="form-label">Weight (kg)</label>
          <input type="number" name="weight" class="form-control" step="0.1" value="{{ record.weight or '' }}" />
        </div>
        <div class="form-group">
          <label class="form-label">Temperature (°C)</label>
          <input type="number" name="temperature" class="form-control" step="0.1" value="{{ record.temperature or '' }}" />
        </div>
      </div>

      <div class="form-group" style="margin-bottom:var(--sp-5);">
        <label class="form-label">Notes</label>
        <textarea name="notes" class="form-control" style="min-height:80px;">{{ record.notes or '' }}</textarea>
      </div>

      <div class="flex gap-3">
        <a href="{{ url_for('health.index') }}" class="btn btn-ghost">Cancel</a>
        <button type="submit" class="btn btn-primary"><svg data-lucide="save"></svg> Update Record</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
